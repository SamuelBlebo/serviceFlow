name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, rules, integration, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The Firebase Emulator Suite needs a JDK (21+).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages, including legacy)
        run: pnpm typecheck

      - name: Unit & component tests
        run: pnpm test

      - name: Security rules tests (Firestore + Storage emulators)
        run: pnpm test:rules

      - name: Functions integration tests (Auth + Firestore + Functions emulators)
        run: pnpm test:integration

      - name: Build web + bundle Cloud Functions
        run: pnpm build

      - name: Compile mobile Android bundle
        run: pnpm --filter @serviceflow/mobile bundle:check
